<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#c8e6ff"/>
      <stop offset="70%" stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#1a4a8a"/>
    </radialGradient>
    <linearGradient id="beam1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4a9eff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#6ab0ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#4a9eff" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#6ab0ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4a9eff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="460" height="460" fill="url(#bg)" rx="40"/>
  <circle cx="230" cy="230" r="200" fill="url(#bg)" opacity="0.5" filter="url(#glow)"/>
  <ellipse cx="230" cy="230" rx="120" ry="42" fill="none" stroke="url(#ring)" stroke-width="2" transform="rotate(-15 230 230)" opacity="0.5"/>
  <ellipse cx="230" cy="230" rx="140" ry="48" fill="none" stroke="url(#ring)" stroke-width="1" transform="rotate(-15 230 230)" opacity="0.2"/>
  <g filter="url(#glowSoft)">
    <polygon points="240,220 390,70 380,55" fill="url(#beam1)" opacity="0.25" transform="rotate(15 230 230)"/>
    <polygon points="220,240 70,380 80,395" fill="url(#beam1)" opacity="0.25" transform="rotate(15 230 230)"/>
  </g>
  <circle cx="230" cy="230" r="50" fill="url(#core)" filter="url(#glowSoft)"/>
  <circle cx="230" cy="230" r="28" fill="white" opacity="0.3"/>
  <circle cx="230" cy="230" r="14" fill="white" opacity="0.5"/>
  <circle cx="230" cy="230" r="6" fill="white"/>
</svg>
